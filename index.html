<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>MisCuentas</title>
    <script>
      // Aplica el tema antes de pintar para evitar parpadeo (FOUC).
      (function () {
        try {
          var raw = localStorage.getItem('miscuentas:theme')
          var stored = 'system'
          if (raw) {
            try {
              stored = JSON.parse(raw)
            } catch (e) {
              stored = raw
            }
          }
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          var resolved =
            stored === 'dark' || (stored !== 'light' && prefersDark)
              ? 'dark'
              : 'light'
          document.documentElement.dataset.theme = resolved
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#000000' : '#f5f5f7')
        } catch (e) {
          /* noop */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
